[project]
name = "pipeline-triage-agent"
version = "0.1.0"
description = "Agentic Incident Triage for Data Pipelines with Deterministic Baseline and Evaluation Harness"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Abhishek Patel", email = "dev.abhishekv@gmail.com" }
]
dependencies = [
    "pydantic>=2.7.0",
    "google-cloud-bigquery>=3.20.0",
    "google-cloud-storage>=2.16.0",
    "google-cloud-logging>=3.10.0",
    "google-cloud-secret-manager>=2.18.0",
    "google-cloud-pubsub>=2.20.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "opentelemetry-api>=1.24.0",
]

[project.optional-dependencies]
agents = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "google-genai>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["substrate", "ops", "triage", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []
